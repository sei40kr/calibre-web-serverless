name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - staging
          - production
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: cat web/.env.${{ inputs.environment }} >>"$GITHUB_ENV"
      # Produces the static export in web/out, served as plain Firebase Hosting.
      - run: bun run build
      # Bundle the metadata function into a single esbuild bundle for Cloud Functions.
      - run: bun run --filter @calibre-web-serverless/functions build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
      # --force auto-confirms non-interactive prompts (e.g. the Artifact
      # Registry cleanup policy for function images).
      - run: bunx firebase-tools deploy --only hosting,firestore:rules,firestore:indexes,storage,functions --project ${{ vars.FIREBASE_PROJECT_ID }} --force
